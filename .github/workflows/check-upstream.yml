name: Check upstream for new patches

# Once a week, compare versions.toml with python-build-standalone's latest
# release and nodejs.org's releases, and open a pull request when a supported
# Python minor or Node.js major has a newer patch.
# Merging it changes nothing anyone runs; tagging each listed version releases
# it, and houses then see it in Updates.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 check-upstream.py --write | tee check.txt
          tags="$(sed -n 's/^tags: //p' check.txt)"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.check.outputs.tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.check.outputs.tags }}
        run: |
          set -euo pipefail
          branch="upstream/$(echo "$TAGS" | tr ' ' '_')"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request for $TAGS is already open."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "Newer interpreter patches: $TAGS"
          git push -q origin "$branch"
          {
            echo "Upstream has newer patches for the interpreters homeCore supports."
            echo
            echo '```'
            grep -v '^tags: ' check.txt
            echo '```'
            echo
            echo "After merging, tag each one to release it:"
            echo
            echo '```'
            for t in $TAGS; do echo "git tag $t && git push origin $t"; done
            echo '```'
          } > body.md
          gh pr create --title "Newer interpreter patches: $TAGS" --body-file body.md --base main --head "$branch"
